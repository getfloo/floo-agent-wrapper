[app]
name = "app"
access_mode = "accounts"

# The gateway is the only way in. Pages need a signed-in user; /api takes an app
# API key holding the "api" scope (floo apps keys create ... --scope api).
# Any app with a key route must also declare "/" explicitly.
[[routes]]
path = "/"
access = "accounts"
service = "web"

[[routes]]
path = "/api"
access = "api_key"
# Keep "api": keys are minted per app, so it is already private to this app.
# Renaming a scope after the first deploy is refused on push.
scope = "api"
service = "web"

[services.web]
type = "web"
path = "."
port = 3000
# Runs once per deploy before traffic moves; a failure stops the deploy and the
# previous revision keeps serving. floo dev runs it before starting the app.
migrate_command = "node_modules/.bin/tsx scripts/migrate.ts"
# 0 scales to zero when idle, so the first request after a quiet spell waits a few
# seconds for a cold start. floo keeps it warm for an hour after each visit or
# deploy. Set 1 to keep an instance ready; it is billed while idle.
# https://getfloo.com/docs/guides/cold-starts
min_instances = 0

# Only the default Postgres resource injects the unsuffixed DATABASE_URL.
[managed.default]
type = "postgres"
